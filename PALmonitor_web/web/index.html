<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>PALmonitor 웹</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== 로그인 화면 ===== -->
  <section id="login-view" class="view">
    <div class="card">
      <h1>PALmonitor</h1>
      <p class="sub">웹 원격 화면보기 · 로그인</p>

      <label>이메일
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
      </label>
      <label>비밀번호
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      </label>

      <details class="advanced">
        <summary>연결 설정</summary>
        <label>릴레이 서버(WebSocket)
          <input id="relayUrl" type="text" placeholder="ws://릴레이PC주소:58080" />
        </label>
        <label>보조 PC 주소
          <input id="auxHost" type="text" placeholder="192.168.0.20" />
        </label>
        <label>보조 PC 포트
          <input id="auxPort" type="text" value="58712" />
        </label>
        <label>연결 암호(SECRET)
          <input id="secret" type="password" placeholder="보조 PC의 SECRET" />
        </label>
      </details>

      <button id="loginBtn">로그인 후 연결</button>
      <p id="loginMsg" class="msg"></p>
    </div>
  </section>

  <!-- ===== 뷰어 화면 ===== -->
  <section id="viewer-view" class="view hidden">
    <header class="topbar">
      <span id="status" class="status">연결 중…</span>
      <div class="spacer"></div>
      <button id="kbBtn" class="tbtn" title="키보드 입력 켜기/끄기">⌨ 키보드 OFF</button>
      <button id="fsBtn" class="tbtn" title="전체화면">⛶</button>
      <button id="logoutBtn" class="tbtn">로그아웃</button>
    </header>
    <div id="stage" class="stage">
      <canvas id="screen"></canvas>
    </div>
    <!-- 모바일 입력용 숨은 텍스트 입력 (키보드 올리기) -->
    <input id="hiddenInput" class="hidden-input" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" />
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
