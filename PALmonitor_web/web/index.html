<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>PALmonitor</title>
  <meta name="theme-color" content="#0f1216" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== 로그인 화면 ===== -->
  <section id="login-view" class="view">
    <div class="card">
      <h1>PALmonitor</h1>
      <p class="sub">웹 원격 화면보기 · 로그인</p>

      <label>이메일
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
      </label>
      <label>비밀번호
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      </label>

      <button id="loginBtn">로그인 후 연결</button>
      <p class="hint">연결 코드는 로그인하면 계정별로 자동 연결됩니다.</p>
      <p id="loginMsg" class="msg"></p>
    </div>
  </section>

  <!-- ===== 뷰어 화면 ===== -->
  <section id="viewer-view" class="view hidden">
    <div id="stage" class="stage">
      <canvas id="screen"></canvas>
    </div>
    <aside id="sidebar" class="sidebar">
      <span id="status" class="dot" title="상태"></span>
      <button id="kbBtn" class="sbtn" title="키보드">⌨</button>
      <button id="rclickBtn" class="sbtn" title="다음 탭을 우클릭">우클릭</button>
      <button id="ctrlBtn" class="sbtn" title="Ctrl 켜기/끄기">Ctrl</button>
      <button id="scrollUpBtn" class="sbtn" title="위로 스크롤">▲</button>
      <button id="scrollDownBtn" class="sbtn" title="아래로 스크롤">▼</button>
      <button id="zoomInBtn" class="sbtn" title="확대">＋</button>
      <button id="zoomOutBtn" class="sbtn" title="축소">－</button>
      <button id="fsBtn" class="sbtn" title="전체화면">⛶</button>
      <button id="logoutBtn" class="sbtn" title="로그아웃">⎋</button>
    </aside>
    <input id="hiddenInput" class="hidden-input" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" />
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
