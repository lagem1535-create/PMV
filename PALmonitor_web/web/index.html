<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>PALmonitor</title>
  <meta name="theme-color" content="#0f1216" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== 로그인 화면 ===== -->
  <section id="login-view" class="view">
    <div class="card">
      <h1>PALmonitor</h1>
      <p class="sub">웹 원격 화면보기 · 로그인</p>

      <label>이메일
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
      </label>
      <label>비밀번호
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      </label>

      <button id="loginBtn">로그인 후 연결</button>
      <p class="hint">연결 코드는 로그인하면 계정별로 자동 연결됩니다.</p>
      <p id="loginMsg" class="msg"></p>
    </div>
  </section>

  <!-- ===== 뷰어 화면 ===== -->
  <section id="viewer-view" class="view hidden">
    <header class="topbar">
      <span id="status" class="status">연결 중…</span>
      <div class="spacer"></div>
      <button id="kbBtn" class="tbtn" title="키보드 입력 켜기/끄기">⌨ OFF</button>
      <button id="fsBtn" class="tbtn" title="전체화면">⛶</button>
      <button id="logoutBtn" class="tbtn">로그아웃</button>
    </header>
    <div id="stage" class="stage">
      <canvas id="screen"></canvas>
    </div>
    <input id="hiddenInput" class="hidden-input" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" />
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
